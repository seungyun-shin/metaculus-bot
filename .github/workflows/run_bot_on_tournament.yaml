name: Forecast on new AI tournament questions

# FutureEval seasonal tournament + MiniBench. Already-forecast questions are
# skipped, so each run only spends money on new questions.
#
# Every 30 minutes. On a PRIVATE repository GitHub gives 2,000 free Actions
# minutes/month; a run with no new questions takes about 1 minute, so 48 runs/day
# is roughly 1,450 minutes/month. Public repositories have no minute limit.
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: uv run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          BOT_LLM_PROVIDER: ${{ vars.BOT_LLM_PROVIDER }}
          BOT_MODEL: ${{ vars.BOT_MODEL }}
          BOT_PARSER_MODEL: ${{ vars.BOT_PARSER_MODEL }}
          BOT_EFFORT: ${{ vars.BOT_EFFORT }}
          BOT_RESEARCH: ${{ vars.BOT_RESEARCH }}
          BOT_PREDICTIONS_PER_QUESTION: ${{ vars.BOT_PREDICTIONS_PER_QUESTION }}
          BOT_MAX_COST_PER_QUESTION_USD: ${{ vars.BOT_MAX_COST_PER_QUESTION_USD }}
          BOT_MAX_COST_PER_RUN_USD: ${{ vars.BOT_MAX_COST_PER_RUN_USD }}
          BOT_MAX_QUESTIONS_PER_RUN: ${{ vars.BOT_MAX_QUESTIONS_PER_RUN }}
          BOT_PUBLISH: ${{ vars.BOT_PUBLISH }}
